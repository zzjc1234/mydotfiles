# Based on MrVivekRajan/Hyprlock-Styles Style-10, adapted for this machine.

background {
    monitor =
    path = ~/.config/hypr/hyprlock-style/style-10-background.png
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

general {
}

label {
    monitor =
    text = cmd[update:1000] date +"%A"
    color = rgba(216, 222, 233, 0.70)
    font_size = 90
    font_family = Noto Sans
    position = 0, 350
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%d %B"
    color = rgba(216, 222, 233, 0.70)
    font_size = 40
    font_family = Noto Sans
    position = 0, 250
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"- %I:%M -")</span>"
    color = rgba(216, 222, 233, 0.70)
    font_size = 20
    font_family = Noto Sans
    position = 0, 190
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/.config/hypr/hyprlock-style/user.png
    border_size = 2
    border_color = rgba(255, 255, 255, 0.65)
    size = 130
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = 0, 40
    halign = center
    valign = center
}

shape {
    monitor =
    size = 300, 60
    color = rgba(255, 255, 255, 0.1)
    rounding = -1
    border_size = 0
    border_color = rgba(255, 255, 255, 0)
    rotate = 0
    xray = false
    position = 0, -130
    halign = center
    valign = center
}

label {
    monitor =
    text =     $USER
    color = rgba(216, 222, 233, 0.80)
    font_size = 18
    font_family = Google Sans Code NF
    position = 0, -130
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = Noto Sans
    placeholder_text = <i><span foreground="##ffffff99">Enter Pass</span></i>
    hide_input = false
    position = 0, -210
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰜉
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    font_family = Google Sans Code NF
    onclick = reboot now
    position = 0, 80
    halign = center
    valign = bottom
}

label {
    monitor =
    text = 󰐥
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    font_family = Google Sans Code NF
    onclick = shutdown now
    position = 180, 80
    halign = center
    valign = bottom
}

label {
    monitor =
    text = 󰍹
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    font_family = Google Sans Code NF
    onclick = power-off-monitors
    position = -180, 80
    halign = center
    valign = bottom
}
